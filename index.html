<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Restaurante Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="bg-brand-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="chef-hat" class="w-8 h-8"></i>
                    <span class="font-bold text-xl tracking-tight hidden sm:block">GastroStock</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="exportToCSV()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-500 transition px-3 py-2 rounded-lg text-sm font-medium">
                        <i data-lucide="sheet" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Exportar a Excel</span>
                    </button>
                    <button onclick="openModal()" class="flex items-center gap-2 bg-white text-brand-700 hover:bg-gray-100 transition px-4 py-2 rounded-lg text-sm font-bold shadow">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Nuevo</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex flex-col justify-center">
                <p class="text-sm text-gray-500 font-medium">Total Productos</p>
                <p class="text-2xl font-bold text-gray-800" id="stat-total">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex flex-col justify-center">
                <p class="text-sm text-gray-500 font-medium">Valor Inventario</p>
                <p class="text-2xl font-bold text-emerald-600" id="stat-value">$0.00</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex flex-col justify-center col-span-2 md:col-span-2 relative">
                <i data-lucide="search" class="absolute left-7 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                <input type="text" id="searchInput" placeholder="Buscar productos..." onkeyup="renderTable()" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition text-sm">
            </div>
        </div>

        <!-- Inventory List (Table for Desktop, Cards for Mobile) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <!-- Mobile View (< sm) -->
            <div id="mobile-inventory" class="sm:hidden divide-y divide-gray-100">
                <!-- Injected via JS -->
            </div>

            <!-- Desktop View (>= sm) -->
            <div class="hidden sm:block overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Producto</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Categoría</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Precio Unit.</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="desktop-inventory" class="bg-white divide-y divide-gray-200">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 px-4 text-center">
                <div class="bg-gray-50 p-4 rounded-full mb-4">
                    <i data-lucide="package-open" class="w-12 h-12 text-gray-400"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900">No hay productos</h3>
                <p class="mt-1 text-sm text-gray-500 mb-4">Comienza agregando productos a tu inventario.</p>
                <button onclick="openModal()" class="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 transition">
                    Agregar el primer producto
                </button>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-900 bg-opacity-50 transition-opacity backdrop-blur-sm" onclick="closeModal()"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                    
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="flex justify-between items-center mb-5">
                            <h3 class="text-xl font-bold leading-6 text-gray-900" id="modal-title">Registrar Producto</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition">
                                <i data-lucide="x" class="w-6 h-6"></i>
                            </button>
                        </div>
                        
                        <form id="productForm" onsubmit="saveProduct(event)">
                            <input type="hidden" id="productId">
                            
                            <div class="space-y-4">
                                <!-- Photo Upload Area -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Foto del Producto</label>
                                    <div class="mt-1 flex justify-center rounded-xl border-2 border-dashed border-gray-300 px-6 pt-5 pb-6 bg-gray-50 hover:bg-gray-100 transition relative overflow-hidden" id="drop-zone">
                                        <div class="space-y-1 text-center z-10" id="upload-prompt">
                                            <i data-lucide="camera" class="mx-auto h-12 w-12 text-gray-400"></i>
                                            <div class="flex text-sm text-gray-600 justify-center">
                                                <label for="productImage" class="relative cursor-pointer rounded-md font-medium text-brand-600 focus-within:outline-none hover:text-brand-500">
                                                    <span>Tomar foto o subir</span>
                                                    <!-- capture="environment" opens rear camera on mobile -->
                                                    <input id="productImage" name="productImage" type="file" class="sr-only" accept="image/*" capture="environment" onchange="handleImageChange(event)">
                                                </label>
                                            </div>
                                            <p class="text-xs text-gray-500">PNG, JPG hasta 5MB</p>
                                        </div>
                                        <!-- Image Preview -->
                                        <div id="image-preview-container" class="hidden absolute inset-0 w-full h-full bg-black">
                                            <img id="image-preview" src="" class="w-full h-full object-cover opacity-80">
                                            <div class="absolute inset-0 flex items-center justify-center">
                                                <button type="button" onclick="clearImage()" class="bg-red-500 text-white p-2 rounded-full shadow-lg hover:bg-red-600 transition">
                                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <input type="hidden" id="imageBase64">
                                    </div>
                                </div>

                                <!-- Text Inputs -->
                                <div>
                                    <label for="productName" class="block text-sm font-medium text-gray-700">Nombre del Producto *</label>
                                    <input type="text" id="productName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm p-2 border bg-gray-50 focus:bg-white">
                                </div>
                                
                                <div>
                                    <label for="productCategory" class="block text-sm font-medium text-gray-700">Categoría</label>
                                    <select id="productCategory" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm p-2 border bg-gray-50 focus:bg-white">
                                        <option value="Bebidas">Bebidas</option>
                                        <option value="Carnes">Carnes</option>
                                        <option value="Verduras">Verduras</option>
                                        <option value="Lácteos">Lácteos</option>
                                        <option value="Insumos Secos">Insumos Secos</option>
                                        <option value="Limpieza">Limpieza</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label for="productStock" class="block text-sm font-medium text-gray-700">Cantidad en Stock *</label>
                                        <input type="number" id="productStock" required min="0" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm p-2 border bg-gray-50 focus:bg-white">
                                    </div>
                                    <div>
                                        <label for="productPrice" class="block text-sm font-medium text-gray-700">Precio Unitario ($) *</label>
                                        <input type="number" id="productPrice" required min="0" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm p-2 border bg-gray-50 focus:bg-white">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mt-6 sm:flex sm:flex-row-reverse">
                                <button type="submit" class="inline-flex w-full justify-center rounded-lg bg-brand-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 sm:ml-3 sm:w-auto">
                                    Guardar Producto
                                </button>
                                <button type="button" onclick="closeModal()" class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-20 opacity-0 flex items-center gap-2 z-50">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
        <span id="toast-msg" class="text-sm font-medium">Acción exitosa</span>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // State Management
        let inventory = JSON.parse(localStorage.getItem('gastroInventory')) || [];

        // Formatting utilities
        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
        
        // Initial Render
        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });

        // --- Core Functions ---

        function renderTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const desktopBody = document.getElementById('desktop-inventory');
            const mobileBody = document.getElementById('mobile-inventory');
            const emptyState = document.getElementById('empty-state');
            
            // Filter inventory
            const filtered = inventory.filter(item => 
                item.name.toLowerCase().includes(searchTerm) || 
                item.category.toLowerCase().includes(searchTerm)
            );

            // Update Stats
            document.getElementById('stat-total').innerText = inventory.length;
            // Modificado: Ahora solo suma los precios sin multiplicar por el stock
            const totalValue = inventory.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('stat-value').innerText = formatMoney(totalValue);

            // Handle Empty State
            if (filtered.length === 0) {
                desktopBody.innerHTML = '';
                mobileBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                document.querySelector('table').parentElement.classList.add('hidden');
                mobileBody.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                document.querySelector('table').parentElement.classList.remove('hidden');
                mobileBody.classList.remove('hidden');
            }

            // Render Desktop
            desktopBody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="h-10 w-10 flex-shrink-0">
                                ${item.image 
                                    ? `<img class="h-10 w-10 rounded-lg object-cover border border-gray-200" src="${item.image}" alt="">` 
                                    : `<div class="h-10 w-10 rounded-lg bg-gray-100 flex items-center justify-center border border-gray-200"><i data-lucide="image" class="w-5 h-5 text-gray-400"></i></div>`
                                }
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${item.name}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                            ${item.category}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900 font-bold ${item.stock <= 5 ? 'text-red-600' : ''}">${item.stock}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatMoney(item.price)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="editItem('${item.id}')" class="text-indigo-600 hover:text-indigo-900 mr-3 transition p-1"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-900 transition p-1"><i data-lucide="trash" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            `).join('');

            // Render Mobile
            mobileBody.innerHTML = filtered.map(item => `
                <div class="p-4 bg-white flex items-center gap-4">
                    <div class="h-16 w-16 flex-shrink-0">
                        ${item.image 
                            ? `<img class="h-16 w-16 rounded-xl object-cover border border-gray-200 shadow-sm" src="${item.image}" alt="">` 
                            : `<div class="h-16 w-16 rounded-xl bg-gray-100 flex items-center justify-center border border-gray-200"><i data-lucide="image" class="w-8 h-8 text-gray-400"></i></div>`
                        }
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-gray-900 truncate">${item.name}</p>
                        <p class="text-xs text-gray-500 truncate mb-1">${item.category}</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-sm font-semibold ${item.stock <= 5 ? 'text-red-600' : 'text-gray-700'}">Stock: ${item.stock}</span>
                            <span class="text-sm font-medium text-emerald-600">${formatMoney(item.price)}</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="editItem('${item.id}')" class="p-2 bg-gray-50 text-indigo-600 rounded-lg border border-gray-200"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteItem('${item.id}')" class="p-2 bg-red-50 text-red-600 rounded-lg border border-red-100"><i data-lucide="trash" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons(); // Re-initialize icons for newly added HTML
        }

        // --- Form & Modal Handling ---

        function openModal() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            clearImage();
            document.getElementById('modal-title').innerText = 'Registrar Producto';
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            
            const id = document.getElementById('productId').value;
            const item = {
                id: id || Date.now().toString(), // Generate unique ID if new
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                stock: parseFloat(document.getElementById('productStock').value),
                price: parseFloat(document.getElementById('productPrice').value),
                image: document.getElementById('imageBase64').value
            };

            if (id) {
                // Update existing
                const index = inventory.findIndex(i => i.id === id);
                inventory[index] = item;
                showToast('Producto actualizado exitosamente');
            } else {
                // Add new
                inventory.unshift(item);
                showToast('Producto agregado al inventario');
            }

            saveData();
            renderTable();
            closeModal();
        }

        function editItem(id) {
            const item = inventory.find(i => i.id === id);
            if (!item) return;

            document.getElementById('productId').value = item.id;
            document.getElementById('productName').value = item.name;
            document.getElementById('productCategory').value = item.category;
            document.getElementById('productStock').value = item.stock;
            document.getElementById('productPrice').value = item.price;
            
            if (item.image) {
                document.getElementById('imageBase64').value = item.image;
                document.getElementById('image-preview').src = item.image;
                document.getElementById('upload-prompt').classList.add('hidden');
                document.getElementById('image-preview-container').classList.remove('hidden');
            } else {
                clearImage();
            }

            document.getElementById('modal-title').innerText = 'Editar Producto';
            document.getElementById('productModal').classList.remove('hidden');
        }

        function deleteItem(id) {
            if(confirm('¿Estás seguro de que deseas eliminar este producto?')) {
                inventory = inventory.filter(i => i.id !== id);
                saveData();
                renderTable();
                showToast('Producto eliminado');
            }
        }

        function saveData() {
            localStorage.setItem('gastroInventory', JSON.stringify(inventory));
        }

        // --- Image Processing (Camera/Upload) ---

        function handleImageChange(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Resize image via Canvas to save localStorage space (5MB limit)
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Small size perfect for thumbnails/lists
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG format
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // Update UI
                    document.getElementById('imageBase64').value = dataUrl;
                    document.getElementById('image-preview').src = dataUrl;
                    
                    document.getElementById('upload-prompt').classList.add('hidden');
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function clearImage() {
            document.getElementById('imageBase64').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('image-preview').src = '';
            document.getElementById('upload-prompt').classList.remove('hidden');
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        // --- CSV Export (Hoja de cálculo) ---

        function exportToCSV() {
            if (inventory.length === 0) {
                showToast('El inventario está vacío');
                return;
            }

            // Define headers
            const headers = ['Nombre', 'Categoria', 'Stock', 'Precio Unitario'];
            
            // Map data
            const rows = inventory.map(item => [
                `"${item.name.replace(/"/g, '""')}"`, // Escape quotes
                `"${item.category}"`,
                item.stock,
                item.price
            ]);

            // Combine headers and rows
            const csvContent = [
                headers.join(','),
                ...rows.map(r => r.join(','))
            ].join('\n');

            // Add BOM for correct UTF-8 rendering in Excel
            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            const date = new Date().toISOString().split('T')[0];
            
            link.setAttribute("href", url);
            link.setAttribute("download", `Inventario_Restaurante_${date}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('Archivo CSV descargado correctamente');
        }

        // --- Utilities ---

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
